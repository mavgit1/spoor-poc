name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spoor

      - name: Format
        working-directory: spoor
        run: cargo fmt --check

      - name: Test
        working-directory: spoor
        run: cargo test

      - name: Clippy
        working-directory: spoor
        run: cargo clippy --all-targets -- -D warnings
