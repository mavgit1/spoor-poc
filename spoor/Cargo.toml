[package]
name = "spoor"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.102"
axum = "0.8"
base64 = "0.22"
chromiumoxide = { version = "0.9", features = ["fetcher", "zip8", "rustls"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
dirs = "6.0.0"
flate2 = "1.1"
futures = "0.3.32"
getrandom = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
